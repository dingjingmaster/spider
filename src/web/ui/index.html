<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spider · 爬虫运行状态</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<header><div class="brand"><span class="brand-mark">S</span><div><strong>Spider</strong><small>爬虫运行状态</small></div></div><div class="connection"><span id="connection" role="status">正在连接</span><button id="token-toggle">连接设置</button></div></header>
<div id="token-panel" class="token-panel" hidden><label>API 访问口令<input id="token" type="password" autocomplete="off"></label><button id="token-save">连接</button><span>口令仅保存在当前浏览器会话中。</span></div>
<main>
  <div class="page-heading"><div><p class="eyebrow">CRAWLER MONITOR</p><h1>爬虫运行状态</h1><p>查看已注册爬虫的执行情况，页面自动刷新。</p></div><div class="refresh"><span id="updated-at">等待更新</span><button id="refresh">刷新</button></div></div>
  <div id="notice" role="status" hidden></div>
  <section class="summary" aria-label="运行概览">
    <div class="metric"><span>爬虫数量</span><strong id="total-count">0</strong></div>
    <div class="metric"><span>正在执行</span><strong id="running-count">0</strong></div>
    <div class="metric"><span>累计成功</span><strong id="success-count">0</strong></div>
    <div class="metric"><span>累计失败</span><strong id="failure-count">0</strong></div>
  </section>
  <section class="card"><div class="section-title"><h2>爬虫列表</h2><span class="muted">按代码注册</span></div>
    <p id="empty-state" class="empty" hidden>当前程序尚未注册爬虫任务。</p>
    <div class="table-scroll"><table><thead><tr><th>爬虫</th><th>执行周期</th><th>最近状态</th><th>成功 / 失败</th><th>最近开始</th><th>下次执行</th><th>操作</th></tr></thead><tbody id="spiders"></tbody></table></div>
  </section>
  <section id="history-card" class="card" hidden><div class="section-title"><h2 id="history-title">运行历史</h2><span class="muted">最近 200 次</span></div>
    <div class="table-scroll"><table><thead><tr><th>运行</th><th>状态</th><th>开始时间</th><th>完成时间</th><th>耗时</th><th>结果数</th></tr></thead><tbody id="runs"></tbody></table></div>
  </section>
  <section id="run-detail" class="card" hidden><div class="section-title"><h2 id="run-title">运行详情</h2><span id="run-state" class="status"></span></div>
    <dl class="details"><div><dt>开始时间</dt><dd id="run-start">—</dd></div><div><dt>完成时间</dt><dd id="run-finish">—</dd></div><div><dt>耗时</dt><dd id="run-duration">—</dd></div><div><dt>结果数</dt><dd id="run-items">0</dd></div></dl>
    <p id="run-progress" class="progress" role="status"></p><p id="run-error" class="error-text"></p>
    <details open><summary>执行日志</summary><pre id="events">暂无日志</pre></details>
  </section>
  <footer>Spider · C / SQLite · 运行状态</footer>
</main>
</body>
</html>
